<div class="task-display">
  @if (isEmailOrPost && safeHtml) {
    <p class="mb-2 flex items-center gap-2 text-xs text-slate-500">
      <svg class="h-4 w-4 shrink-0 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <span>Click the image to view it larger.</span>
    </p>
    <div
      class="content html max-h-[min(60vh,36rem)] overflow-y-auto rounded-2xl border border-slate-200/90 bg-white p-4 shadow-sm ring-1 ring-slate-100 sm:p-6"
      [innerHTML]="safeHtml"
      (click)="onContentClick($event)"
    ></div>
  } @else if (kind === 'site' && payload) {
    <div class="content site rounded-2xl border border-slate-200/90 bg-white p-4 shadow-sm sm:p-6">
      <p class="text-sm text-slate-600">
        Link:
        <a class="font-medium text-teal-700 underline decoration-teal-300 underline-offset-2 hover:text-teal-800" [href]="payload" target="_blank" rel="noopener noreferrer">{{ payload }}</a>
      </p>
      @if (safeUrl) {
        <iframe [src]="safeUrl" class="preview mt-4 h-[400px] w-full rounded-xl border border-slate-200" title="Preview"></iframe>
      }
    </div>
  }

  @if (zoomedSrc) {
    <div
      class="zoom-backdrop fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-[2px]"
      role="dialog"
      aria-modal="true"
      aria-label="Enlarged example image"
      (click)="closeZoom()"
    >
      <button
        type="button"
        class="absolute right-4 top-4 flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-white/10 text-white shadow-lg backdrop-blur-sm transition hover:bg-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        (click)="closeZoom(); $event.stopPropagation()"
        aria-label="Close enlarged image"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div class="max-h-[min(92vh,1200px)] max-w-[min(96vw,1600px)] overflow-auto" (click)="$event.stopPropagation()">
        <img
          [src]="zoomedSrc"
          [alt]="zoomedAlt"
          class="mx-auto block h-auto max-h-[min(92vh,1200px)] w-auto max-w-full rounded-lg object-contain shadow-2xl ring-1 ring-white/10"
          decoding="async"
        />
      </div>
    </div>
  }
</div>

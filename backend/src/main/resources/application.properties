# H2 Database (for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Before the study, users are redirected to LimeSurvey pre-questionnaire
study.limesurvey.pre-url=https://edyta31.limesurvey.net/424696?lang=en&uid=

# When true, /start?skipPre=1 can register and open the study without LimeSurvey (server testing only). Set via STUDY_ALLOW_SKIP_PRE_QUESTIONNAIRE
study.allow-skip-pre-questionnaire=false

# When true, enables POST /api/debug/expected (local verification only). Never enable on production. Set via STUDY_DEBUG_ENABLED
study.debug.enabled=false

# After the study, users are redirected to LimeSurvey post-questionnaire.
study.limesurvey.post-url=https://edyta31.limesurvey.net/954787?lang=en&uid=

# OpenAI API key for generating study materials. Set via STUDY_OPENAI_API_KEY on Render.
study.openai.api-key=sk-proj-dx6Zjexamplekey
